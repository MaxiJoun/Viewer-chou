name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'viewer/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true      # turn Pages on automatically, no Settings click
      - uses: actions/upload-pages-artifact@v3
        with:
          path: viewer          # the static site root — publishes viewer/index.html
      - id: deployment
        uses: actions/deploy-pages@v4
